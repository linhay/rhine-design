<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'"><title>中子星 · 图标选稿</title><style>
*{box-sizing:border-box}body{margin:0;padding:48px 28px 96px;background:#f4f5f0;color:#243b32;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1020px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#768176}h1{font-size:30px;font-weight:550;letter-spacing:-1px;margin:10px 0}p{font-size:13px;color:#6b796f;line-height:1.8;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.option{font:inherit;background:#fff;border:1px solid #dbe1d8;border-radius:14px;padding:18px 20px;text-align:left;cursor:pointer;color:inherit;transition:border-color .15s,box-shadow .15s}.option:hover{border-color:#83a18c}.option[aria-pressed=true]{border-color:#356748;box-shadow:0 0 0 2px #356748}.card-top{display:flex;justify-content:space-between;font-size:11px;color:#738077}.check{visibility:hidden;color:#356748}.option[aria-pressed=true] .check{visibility:visible}.art{height:220px;display:grid;place-items:center}.caption strong{display:block;font-size:16px;font-weight:550;margin-bottom:7px}.caption>span{display:block;font-size:11px;color:#738077;line-height:1.7;min-height:38px}.sizes{border-top:1px solid #edf0e9;padding-top:12px;display:flex;gap:17px;align-items:center;height:44px}.sizes>span:first-child{font-size:10px;color:#839087;margin-right:auto}.dark{display:grid;place-items:center;background:#243b32;border-radius:5px;width:30px;height:30px}.dark img{filter:brightness(0) invert(1)}.bottom{position:fixed;bottom:0;left:0;right:0;border-top:1px solid #dbe1d8;background:#f4f5f0f5;padding:16px 28px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:12px}a{color:#315e40;text-decoration:none}#preview{background:#315e40;color:white;padding:11px 17px;border-radius:7px}#preview[aria-disabled=true]{pointer-events:none;opacity:.4}button:focus-visible,a:focus-visible{outline:3px solid #80a58c;outline-offset:4px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){body{padding:28px 14px 110px}.grid{gap:14px;grid-template-columns:1fr}.option{padding:12px}.art{height:185px}.art img{width:150px;height:150px}.sizes{gap:8px}.sizes>span:first-child{display:none}.caption>span{min-height:57px}.top{align-items:flex-start}h1{font-size:26px}}
</style></head><body><main><header class="top"><div><div class="eyebrow">NEUTRON STAR / ROUND 02</div><h1>从符号，走向一枚应用图标。</h1><p>三种不同气质：磁场、回旋、精密星仪。<br>应用图标保留细节，托盘使用配套单色轮廓。</p></div><a href="./">返回客户端 ↗</a></header><section class="grid" aria-label="三款完整图标候选"><button class="option" data-icon="g" aria-pressed="false"><div class="card-top"><span>01 / 磁极</span><span class="check">✓</span></div><div class="art"><img src="./assets/option-g.svg?v=2" width="184" height="184" alt="磁极应用图标"></div><div class="caption"><strong>磁极</strong><span>冰蓝磁场与双极射束，接近中子星本身。</span></div><div class="sizes"><span>应用 / 托盘</span><img src="./assets/option-g.svg?v=2" width="32" height="32" alt="应用图标 32 像素"><img src="./assets/tray-g.svg" width="20" height="20" alt="单色托盘"><span class="dark"><img src="./assets/tray-g.svg" width="20" height="20" alt="深色托盘"></span></div></button><button class="option" data-icon="h" aria-pressed="false"><div class="card-top"><span>02 / 回流</span><span class="check">✓</span></div><div class="art"><img src="./assets/option-h.svg?v=2" width="184" height="184" alt="回流应用图标"></div><div class="caption"><strong>回流</strong><span>三道收拢的流线，用旋转轮廓表达同步。</span></div><div class="sizes"><span>应用 / 托盘</span><img src="./assets/option-h.svg?v=2" width="32" height="32" alt="应用图标 32 像素"><img src="./assets/tray-h.svg" width="20" height="20" alt="单色托盘"><span class="dark"><img src="./assets/tray-h.svg" width="20" height="20" alt="深色托盘"></span></div></button><button class="option" data-icon="i" aria-pressed="false"><div class="card-top"><span>03 / 星仪</span><span class="check">✓</span></div><div class="art"><img src="./assets/option-i.svg?v=arcane-seal-1" width="184" height="184" alt="星仪应用图标"></div><div class="caption"><strong>星仪</strong><span>金纹符阵 · 双环逆转，朱砂符印微光呼吸。</span></div><div class="sizes"><span>应用 / 托盘</span><img src="./assets/option-i.svg?v=arcane-seal-1" width="32" height="32" alt="应用图标 32 像素"><img src="./assets/tray-i.svg?v=arcane-seal-1" width="20" height="20" alt="单色托盘"><span class="dark"><img src="./assets/tray-i.svg?v=arcane-seal-1" width="20" height="20" alt="深色托盘"></span></div></button></section></main><footer class="bottom"><span id="selection" role="status">点击图标，选择一个方向</span><a id="preview" href="./" aria-disabled="true">放进客户端预览 ↗</a></footer><script>document.querySelectorAll('[data-icon]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-icon]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.getElementById('selection').textContent='当前选择：'+button.querySelector('strong').textContent;const link=document.getElementById('preview');link.href='./?icon='+button.dataset.icon;link.setAttribute('aria-disabled','false');}));document.querySelector('[data-icon="i"]').click();</script></body></html>
